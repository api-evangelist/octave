name: Octave
description: >-
  Octave (Octave Online Therapy) is a modern behavioral and mental health company
  providing personalized, evidence-based therapy — individual, couples, and family
  therapy, plus Dialectical Behavior Therapy (DBT) and specialized Centers of
  Excellence for perinatal/postpartum mental health, LGBTQIA+ (queer resiliency),
  trauma, and women's emotional health. Care is delivered virtually and in-person
  across 20+ U.S. states, with in-network insurance coverage, a therapy cost
  calculator, therapist matching, and a secure client portal. Octave is a portfolio
  company of Obvious Ventures. Octave publishes no public developer API; this API
  Evangelist profile captures the company's public web surface, a provider-published
  llms.txt, and its domain-security posture.
